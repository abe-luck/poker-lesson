<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; background: #F7F7F5; font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; color: #1F2328; }
    a { color: #2F6FEB; } a:hover { color: #1F55C0; }
    .card { width: 52px; height: 74px; border-radius: 6px; background: #FFFFFF; border: 1px solid #D9D9D4; box-sizing: border-box; padding: 5px 6px; display: flex; flex-direction: column; justify-content: space-between; font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
    .card .cr { font-size: 17px; line-height: 1; }
    .card .cs { font-size: 22px; line-height: 1; align-self: flex-end; }
    .card.lg { width: 60px; height: 84px; }
    .card.lg .cr { font-size: 19px; } .card.lg .cs { font-size: 26px; }
    .red { color: #B4443C; } .blk { color: #1F2328; }
    .slot { width: 52px; height: 74px; border-radius: 6px; border: 1.5px dashed rgba(255,255,255,.35); box-sizing: border-box; }
    .use { outline: 3px solid #8FB3FF; outline-offset: 2px; }
    .cpu { background: #FFFFFF; border: 1px solid #E4E4E0; border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; }
    .ibtn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #5B636E; }
    .num { font-variant-numeric: tabular-nums; }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; background: #F7F7F5; display: flex; flex-direction: column; overflow: hidden;">
  <header style="height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 4px; background: #FFFFFF; border-bottom: 1px solid #E4E4E0; box-sizing: border-box;">
    <div style="display: flex; align-items: center;">
      <div class="ibtn"><svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4.5 7 10l5.5 5.5"></path></svg></div>
      <span style="font-size: 12px; font-weight: 500; color: #2F6FEB; background: #EEF3FD; padding: 4px 10px; border-radius: 999px;">初心者モード</span>
      <span class="num" style="font-size: 13px; color: #5B636E; margin-left: 10px;">5 / 10</span>
    </div>
    <div style="display: flex;">
      <div class="ibtn"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h3l4-3.5v11L6 12H3z"></path><path d="m13.5 8 4 4m0-4-4 4"></path></svg></div>
      <div class="ibtn"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10" cy="10" r="7.5"></circle><path d="M7.8 7.8a2.3 2.3 0 1 1 3 2.2c-.6.2-.8.6-.8 1.2v.4"></path><circle cx="10" cy="14.2" r=".6" fill="currentColor"></circle></svg></div>
    </div>
  </header>

  <div style="padding: 12px 16px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
    <div class="cpu"><div style="display: flex; justify-content: space-between; font-size: 13px;"><span style="font-weight: 700;">CPU1</span><span class="num" style="color: #5B636E;">970</span></div><span style="font-size: 12px; color: #5B636E;">ベット 20</span></div>
    <div class="cpu" style="opacity: .55;"><div style="display: flex; justify-content: space-between; font-size: 13px;"><span style="font-weight: 700;">CPU2</span><span class="num" style="color: #5B636E;">990</span></div><span style="font-size: 12px; color: #5B636E;">フォールド</span></div>
    <div class="cpu"><div style="display: flex; justify-content: space-between; font-size: 13px;"><span style="font-weight: 700;">CPU3</span><span class="num" style="color: #5B636E;">970</span></div><span style="font-size: 12px; color: #5B636E;">コール 20</span></div>
  </div>

  <div style="margin: 12px 16px 0; height: 210px; border-radius: 24px; background: #2F5D50; box-shadow: inset 0 0 0 8px #284F44; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;">
    <div class="num" style="font-size: 14px; font-weight: 700; color: #FFFFFF; background: rgba(0,0,0,.22); padding: 5px 14px; border-radius: 999px;">ポット 80</div>
    <div style="display: flex; gap: 6px;">
      <div class="card blk use"><span class="cr">A</span><span class="cs">&spades;&#xFE0E;</span></div>
      <div class="card red"><span class="cr">K</span><span class="cs">&hearts;&#xFE0E;</span></div>
      <div class="card red"><span class="cr">7</span><span class="cs">&diams;&#xFE0E;</span></div>
      <div class="slot"></div>
      <div class="slot"></div>
    </div>
    <div style="font-size: 12px; color: rgba(255,255,255,.7);">フロップ</div>
  </div>

  <div style="margin: 12px 16px 0; background: #FFFFFF; border: 2px solid #2F6FEB; border-radius: 14px; padding: 12px 14px; display: flex; gap: 14px; align-items: center;">
    <div style="display: flex; gap: 6px;">
      <div class="card lg red use"><span class="cr">A</span><span class="cs">&hearts;&#xFE0E;</span></div>
      <div class="card lg blk"><span class="cr">Q</span><span class="cs">&clubs;&#xFE0E;</span></div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 4px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div style="display: flex; align-items: center; gap: 6px;"><span style="font-size: 14px; font-weight: 700;">あなた</span><span style="width: 20px; height: 20px; border-radius: 50%; border: 1px solid #D9D9D4; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-sizing: border-box;">D</span></div>
        <span class="num" style="font-size: 14px; color: #5B636E;">990</span>
      </div>
      <span style="font-size: 15px; font-weight: 700;">ワンペア（Aのペア）</span>
      <div style="display: flex; align-items: center; gap: 6px;">
        <div style="display: flex; gap: 3px;">
          <div style="width: 22px; height: 5px; border-radius: 3px; background: #2F6FEB;"></div>
          <div style="width: 22px; height: 5px; border-radius: 3px; background: #2F6FEB;"></div>
          <div style="width: 22px; height: 5px; border-radius: 3px; background: #2F6FEB;"></div>
          <div style="width: 22px; height: 5px; border-radius: 3px; background: #E4E4E0;"></div>
        </div>
        <span style="font-size: 12px; color: #5B636E;">強い</span>
      </div>
    </div>
  </div>

  <div style="margin: 12px 16px 0; background: #EEF3FD; border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 10px;">
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 12px; color: #5B636E;">ガイド · フロップ（2 / 5）</span>
      <span style="font-size: 15px; font-weight: 700;">おすすめ: コール</span>
      <span style="font-size: 13px; line-height: 1.6;">Aのペアがあり、払う額が小さいため</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: #2F6FEB; font-size: 11px;">
      <svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 5-5 5 5"></path></svg>
      <span>開く</span>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 1px solid #E4E4E0; padding: 12px 16px 24px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <div style="width: 100%; height: 52px; border-radius: 8px; border: 1px solid #D9D9D4; color: #B4443C; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; box-sizing: border-box;">フォールド</div>
      <span style="font-size: 11px; color: #5B636E;">降りる</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <div class="num" style="width: 100%; height: 52px; border-radius: 8px; background: #2F6FEB; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700;">コール 20</div>
      <span style="font-size: 11px; color: #5B636E;">20 払って続ける</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <div style="width: 100%; height: 52px; border-radius: 8px; border: 1px solid #D9D9D4; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; box-sizing: border-box;">レイズ</div>
      <span style="font-size: 11px; color: #5B636E;">40 以上に上げる</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
