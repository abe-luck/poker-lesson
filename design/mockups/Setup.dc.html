<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; background: #F7F7F5; font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; color: #1F2328; }
    a { color: #2F6FEB; } a:hover { color: #1F55C0; }
    .row { display: flex; align-items: center; justify-content: space-between; padding: 0 24px; min-height: 68px; border-top: 1px solid #EDEDEA; }
    .lbl { display: flex; flex-direction: column; gap: 2px; font-size: 15px; font-weight: 500; }
    .sub { font-size: 12px; font-weight: 400; color: #5B636E; }
    .seg { display: flex; gap: 2px; background: #EEF0F2; border-radius: 8px; padding: 3px; }
    .seg span { height: 34px; min-width: 40px; padding: 0 14px; box-sizing: border-box; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #5B636E; }
    .seg span.on { background: #FFFFFF; color: #1F2328; font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
    .field { height: 40px; min-width: 140px; padding: 0 14px; box-sizing: border-box; border: 1px solid #D9D9D4; border-radius: 8px; background: #FFFFFF; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 15px; font-variant-numeric: tabular-nums; }
  </style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; flex-direction: column; background: #F7F7F5;">
  <header style="height: 64px; display: flex; align-items: center; gap: 16px; padding: 0 40px; background: #FFFFFF; border-bottom: 1px solid #E4E4E0; box-sizing: border-box;">
    <div style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #5B636E;">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4.5 7 10l5.5 5.5"></path></svg>
      <span>戻る</span>
    </div>
    <div style="width: 1px; height: 20px; background: #E4E4E0;"></div>
    <span style="font-weight: 700; font-size: 16px;">Poker Lesson</span>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; align-items: center; padding-top: 48px;">
    <div style="width: 720px; display: flex; flex-direction: column; gap: 24px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <h1 style="margin: 0; font-size: 28px; font-weight: 700;">ゲーム設定</h1>
        <span style="font-size: 12px; font-weight: 500; color: #5B636E; background: #EEF0F2; padding: 4px 10px; border-radius: 999px;">プロモード</span>
      </div>

      <div style="background: #FFFFFF; border: 1px solid #E4E4E0; border-radius: 14px; overflow: hidden;">
        <div class="row" style="border-top: none;">
          <div class="lbl">CPUの人数</div>
          <div class="seg"><span>1</span><span>2</span><span>3</span><span>4</span><span class="on">5</span></div>
        </div>
        <div class="row">
          <div class="lbl">CPUの強さ</div>
          <div class="seg"><span class="on">ふつう</span><span>強い</span></div>
        </div>
        <div class="row">
          <div class="lbl">形式<span class="sub">トーナメントは10ハンドごとにブラインドが上がります</span></div>
          <div class="seg"><span>キャッシュゲーム</span><span class="on">トーナメント</span></div>
        </div>
        <div class="row">
          <div class="lbl">最初のチップ</div>
          <div class="field"><span>1,000</span><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#5B636E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m5 7.5 5 5 5-5"></path></svg></div>
        </div>
        <div class="row">
          <div class="lbl">最初のブラインド</div>
          <div class="field"><span>5 / 10</span><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#5B636E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m5 7.5 5 5 5-5"></path></svg></div>
        </div>
        <div class="row">
          <div class="lbl">持ち時間<span class="sub">時間切れはチェック、できなければフォールド</span></div>
          <div class="seg"><span>なし</span><span>15秒</span><span class="on">30秒</span></div>
        </div>
        <div class="row">
          <div class="lbl">ポットオッズを表示<span class="sub">コールに必要な勝率を数字で表示します</span></div>
          <div style="position: relative; width: 44px; height: 26px; border-radius: 13px; background: #2F6FEB;"><div style="position: absolute; top: 3px; left: 21px; width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF;"></div></div>
        </div>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 12px;">
        <div style="height: 48px; padding: 0 24px; border-radius: 8px; background: #FFFFFF; border: 1px solid #D9D9D4; display: flex; align-items: center; font-size: 15px; font-weight: 500; box-sizing: border-box;">戻る</div>
        <div style="height: 48px; padding: 0 32px; border-radius: 8px; background: #2F6FEB; color: #FFFFFF; display: flex; align-items: center; font-size: 15px; font-weight: 700;">ゲーム開始</div>
      </div>
    </div>
  </main>
</div>
</x-dc>
</body>
</html>
