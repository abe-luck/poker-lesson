<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; background: #F7F7F5; font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; color: #1F2328; }
    a { color: #2F6FEB; } a:hover { color: #1F55C0; }
    .sec { font-size: 13px; font-weight: 700; color: #5B636E; margin: 0 4px; }
    .box { background: #FFFFFF; border: 1px solid #E4E4E0; border-radius: 14px; overflow: hidden; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 0 24px; min-height: 68px; border-top: 1px solid #EDEDEA; }
    .row:first-child { border-top: none; }
    .lbl { display: flex; flex-direction: column; gap: 2px; font-size: 15px; font-weight: 500; }
    .sub { font-size: 12px; font-weight: 400; color: #5B636E; }
    .seg { display: flex; gap: 2px; background: #EEF0F2; border-radius: 8px; padding: 3px; }
    .seg span { height: 34px; padding: 0 14px; box-sizing: border-box; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #5B636E; }
    .seg span.on { background: #FFFFFF; color: #1F2328; font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
    .tg { position: relative; width: 44px; height: 26px; border-radius: 13px; background: #2F6FEB; flex-shrink: 0; }
    .tg::after { content: ""; position: absolute; top: 3px; left: 21px; width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF; }
    .tg.off { background: #D5D8DC; }
    .tg.off::after { left: 3px; }
  </style>
</helmet>
<div style="width: 1440px; height: 1000px; display: flex; flex-direction: column; background: #F7F7F5;">
  <header style="height: 64px; display: flex; align-items: center; gap: 16px; padding: 0 40px; background: #FFFFFF; border-bottom: 1px solid #E4E4E0; box-sizing: border-box;">
    <div style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #5B636E;">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4.5 7 10l5.5 5.5"></path></svg>
      <span>戻る</span>
    </div>
    <div style="width: 1px; height: 20px; background: #E4E4E0;"></div>
    <span style="font-weight: 700; font-size: 16px;">Poker Lesson</span>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; align-items: center; padding-top: 40px;">
    <div style="width: 720px; display: flex; flex-direction: column; gap: 12px;">
      <h1 style="margin: 0 0 12px; font-size: 28px; font-weight: 700;">設定</h1>

      <span class="sec">表示</span>
      <div class="box">
        <div class="row">
          <div class="lbl">テーマ</div>
          <div class="seg"><span class="on">ライト</span><span>ダーク</span><span>端末に合わせる</span></div>
        </div>
        <div class="row">
          <div class="lbl">4色デッキ<span class="sub">♦を青、♣を緑で表示して見分けやすくします</span></div>
          <div style="display: flex; align-items: center; gap: 16px;">
            <div style="display: flex; gap: 6px; font-size: 18px; font-weight: 700;">
              <span style="color: #1F2328;">&spades;&#xFE0E;</span><span style="color: #B4443C;">&hearts;&#xFE0E;</span><span style="color: #B4443C;">&diams;&#xFE0E;</span><span style="color: #1F2328;">&clubs;&#xFE0E;</span>
            </div>
            <div class="tg off"></div>
          </div>
        </div>
        <div class="row">
          <div class="lbl">アニメーション</div>
          <div class="seg"><span class="on">通常</span><span>短め</span><span>なし</span></div>
        </div>
      </div>

      <span class="sec" style="margin-top: 12px;">効果音</span>
      <div class="box">
        <div class="row">
          <div class="lbl">効果音<span class="sub">ゲーム画面のスピーカーアイコンからも切り替えられます</span></div>
          <div class="tg"></div>
        </div>
        <div class="row">
          <div class="lbl">音量</div>
          <div class="seg"><span>小</span><span class="on">中</span><span>大</span></div>
        </div>
      </div>

      <span class="sec" style="margin-top: 12px;">ヒント</span>
      <div class="box">
        <div class="row">
          <div class="lbl">初心者モードで、おすすめを表示</div>
          <div class="tg"></div>
        </div>
        <div class="row">
          <div class="lbl">プロモードで、今の役を表示</div>
          <div class="tg off"></div>
        </div>
      </div>

      <span class="sec" style="margin-top: 12px;">データ</span>
      <div class="box">
        <div class="row">
          <div class="lbl">成績と履歴を消去<span class="sub">この操作は取り消せません</span></div>
          <div style="height: 40px; padding: 0 18px; border-radius: 8px; border: 1px solid #D9D9D4; color: #B4443C; display: flex; align-items: center; font-size: 14px; font-weight: 500; box-sizing: border-box;">消去する</div>
        </div>
      </div>
    </div>
  </main>
</div>
</x-dc>
</body>
</html>
